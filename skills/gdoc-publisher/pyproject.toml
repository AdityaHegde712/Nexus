[project]
name = "gdoc-publisher"
version = "0.1.0"
description = "Convert Markdown files to styled Google Docs and publish to Google Drive"
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
